<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your cookbook</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2C3B2E">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cookbook">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
  .topbar { background: var(--basil); padding: 22px 20px; }
  .topbar-inner { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mustard); border: 1px solid var(--mustard-line); border-radius: 3px; padding: 2px 6px; }
  .brand h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; color: var(--card); margin: 0; }
  .topbar-actions { display: flex; gap: 10px; }
  .nav-link { color: var(--mustard-soft); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); }
  .nav-link:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.24); color: var(--mustard-soft); }
  .nav-link.primary { background: var(--mustard); border-color: var(--mustard); color: var(--basil); font-weight: 600; }
  .nav-link.primary:hover { background: #f0b752; color: var(--basil); }

  .wrap { max-width: 920px; padding-top: 28px; }

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; flex-wrap: wrap; }
  .search { position: relative; flex: 1; min-width: 220px; }
  .search input { padding-left: 34px; font-size: 14px; }
  .search .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  .filter-chip { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--basil-soft); background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 9px 12px; cursor: pointer; white-space: nowrap; }
  .filter-chip.active { background: var(--basil); color: var(--card); border-color: var(--basil); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-bottom: 44px; }
  .recipe-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; text-decoration: none; display: block; color: inherit; transition: border-color 0.15s ease, transform 0.15s ease; }
  .recipe-card:hover { border-color: var(--mustard-line); transform: translateY(-2px); }
  .thumb { height: 140px; background: var(--basil); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb.placeholder::after { content: 'no photo yet'; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(246, 240, 226, 0.4); letter-spacing: 0.04em; }
  .card-body { padding: 14px 16px 16px; }
  .card-body h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; color: var(--basil); margin: 0 0 8px; }
  .card-meta { display: flex; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
  .empty-slot { border: 1.5px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; min-height: 220px; cursor: pointer; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; text-decoration: none; transition: border-color 0.15s ease, color 0.15s ease; }
  .empty-slot:hover { border-color: var(--mustard-line); color: var(--paprika); }

  .saved-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--mustard-soft); border: 1px solid var(--mustard-line); border-radius: 6px; padding: 12px 16px; margin-bottom: 24px; font-size: 13.5px; color: var(--charcoal); }
  .saved-banner button { background: none; border: none; color: var(--basil-soft); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark">book</span>
      <h1>Your cookbook</h1>
    </div>
    <div class="topbar-actions">
      <a class="btn nav-link" href="tips.html">Tips library</a>
      <a class="btn nav-link primary" href="add-recipe.html" id="addRecipeLink">+ Add recipe</a>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="saved-banner" id="savedBanner" style="display:none">
    <span id="savedBannerText"></span>
    <button type="button" id="savedBannerClose" aria-label="Dismiss">&times;</button>
  </div>

  <div class="toolbar">
    <div class="search">
      <span class="icon">&#8981;</span>
      <input type="text" placeholder="Search recipes or ingredients" id="searchInput">
    </div>
    <div class="filter-chip active" data-tag="All">All</div>
    <div class="filter-chip" data-tag="Weeknight">Weeknight</div>
    <div class="filter-chip" data-tag="Baking">Baking</div>
    <div class="filter-chip" data-tag="Slow cook">Slow cook</div>
  </div>

  <div class="section-label">
    <h2 style="margin:0">Recipes</h2>
    <span class="count" id="recipeCount"></span>
  </div>

  <div class="grid" id="recipeGrid"></div>

</div>

<script src="js/tips-engine.js"></script>
<script src="js/github-store.js"></script>
<script>
GitHubStore.ensureAccessChoice().then(mode => {
  if (mode === 'view-only') document.getElementById('addRecipeLink').style.display = 'none';
});

(function showSavedBanner() {
  const params = new URLSearchParams(location.search);
  const saved = params.get('saved');
  if (!saved) return;

  const banner = document.getElementById('savedBanner');
  const text = document.getElementById('savedBannerText');
  const label = saved === 'updated' ? 'Recipe updated.' : saved === 'deleted' ? 'Recipe deleted.' : 'Recipe saved.';
  text.textContent = label + ' It can take a minute or so to appear here while the site rebuilds.';
  banner.style.display = 'flex';
  document.getElementById('savedBannerClose').addEventListener('click', () => {
    banner.style.display = 'none';
  });

  params.delete('saved');
  const cleanUrl = location.pathname + (params.toString() ? '?' + params.toString() : '');
  history.replaceState(null, '', cleanUrl);
})();

let allRecipes = [];
let activeTag = 'All';

const grid = document.getElementById('recipeGrid');

function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = allRecipes.filter(r => {
    const matchesTag = activeTag === 'All' || (r.tags || []).includes(activeTag);
    const matchesSearch = !q || r.title.toLowerCase().includes(q) ||
      r.ingredients.some(i => i.name.toLowerCase().includes(q));
    return matchesTag && matchesSearch;
  });

  grid.innerHTML = '';
  list.forEach(r => {
    const card = document.createElement('a');
    card.className = 'recipe-card';
    card.href = `recipe.html?id=${encodeURIComponent(r.id)}`;
    card.innerHTML = `
      <div class="thumb ${r.image ? '' : 'placeholder'}">
        ${r.image ? `<img src="${r.image}" alt="">` : ''}
      </div>
      <div class="card-body">
        <h3>${TipsEngine.escapeHtml(r.title)}</h3>
        <div class="card-meta">
          <span>${TipsEngine.escapeHtml(r.time)}</span>
          <span>${TipsEngine.escapeHtml(r.servings)} servings</span>
        </div>
      </div>`;
    grid.appendChild(card);
  });

  const emptySlot = document.createElement('a');
  emptySlot.className = 'empty-slot';
  emptySlot.href = 'add-recipe.html';
  emptySlot.textContent = '+ Add your next recipe';
  grid.appendChild(emptySlot);

  document.getElementById('recipeCount').textContent = list.length + (list.length === 1 ? ' saved' : ' saved');
}

document.getElementById('searchInput').addEventListener('input', renderCards);

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeTag = chip.dataset.tag;
    renderCards();
  });
});

TipsEngine.loadRecipes()
  .then(data => { allRecipes = data; renderCards(); })
  .catch(err => {
    grid.innerHTML = `<p style="color:var(--danger)">Couldn't load recipes.json \u2014 ${err.message}</p>`;
  });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('Service worker registration failed:', err.message);
    });
  });
}
</script>
</body>
</html>
